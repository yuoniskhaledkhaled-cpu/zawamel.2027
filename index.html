<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>زوامل عيسى الليث 2027</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0d1117, #161b22, #090d16);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 25px;
            margin-top: 15px;
        }
        .logo-box {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            box-shadow: 0 8px 20px rgba(0, 114, 255, 0.4);
        }
        .logo-box svg {
            width: 45px;
            height: 45px;
            fill: #ffffff;
        }
        h1 {
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        .menu-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            padding: 10px 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            text-decoration: none;
            color: #ffffff;
            transition: all 0.3s ease;
        }
        .menu-item:last-child {
            border-bottom: none;
        }
        .menu-item:active {
            background: rgba(255, 255, 255, 0.12);
            border-radius: 12px;
        }
        .menu-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .icon-circle {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }
        .c-blue { background: rgba(0, 198, 255, 0.2); color: #00c6ff; }
        .c-red { background: rgba(255, 75, 75, 0.2); color: #ff4b4b; }
        .c-gray { background: rgba(255, 255, 255, 0.1); color: #d0d0d0; }
        .c-orange { background: rgba(255, 165, 0, 0.2); color: #ffa500; }
        
        .menu-title {
            font-size: 16px;
            font-weight: 500;
        }
        .arrow {
            color: #888;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo-box">
            <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/></svg>
        </div>
        <h1>زوامل عيسى الليث</h1>
    </div>

    <div class="menu-card">
        <a href="#" class="menu-item" onclick="alert('جاري بدء الاستماع...'); return false;">
            <div class="menu-left">
                <div class="icon-circle c-blue">▶</div>
                <span class="menu-title">بدء الاستماع</span>
            </div>
            <span class="arrow">‹</span>
        </a>
        
        <a href="#" class="menu-item" onclick="alert('قائمتي المفضلة فارغة حالياً'); return false;">
            <div class="menu-left">
                <div class="icon-circle c-red">❤</div>
                <span class="menu-title">قائمتي المفضلة</span>
            </div>
            <span class="arrow">‹</span>
        </a>
        
        <a href="#" class="menu-item" onclick="alert('تطبيقاتنا قادمة قريباً'); return false;">
            <div class="menu-left">
                <div class="icon-circle c-gray">+</div>
                <span class="menu-title">تطبيقاتنا</span>
            </div>
            <span class="arrow">‹</span>
        </a>
        
        <a href="#" class="menu-item" onclick="alert('شكراً لتقييمك التطبيق!'); return false;">
            <div class="menu-left">
                <div class="icon-circle c-orange">★</div>
                <span class="menu-title">قيمنا + تعليق</span>
            </div>
            <span class="arrow">‹</span>
        </a>
    </div>

</body>
</html>
